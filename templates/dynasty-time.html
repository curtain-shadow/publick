{% extends 'base.html' %}
{% load static %}

{% block title %}中华传统纹样数字库 · 纹承{% endblock %}

{% block extra_css %}

<style>
  :root {
    --bg: #f7f1e8;
    --paper: rgba(255, 255, 255, 0.52);
    --line: #7c513d;
    --line-soft: rgba(124, 81, 61, 0.25);
    --point: #7f4b33;
    --text: #6d4635;
    --text-soft: rgba(109, 70, 53, 0.82);
    --gold: #b3832d;
    --gold-soft: rgba(179, 131, 45, 0.15);
    --shadow: rgba(90, 50, 30, 0.18);
    --card: rgba(255, 255, 255, 0.32);
    --active: #9a5d3b;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
    background:
      radial-gradient(circle at 25px 25px, rgba(131, 83, 59, 0.02) 2px, transparent 2px) 0 0 / 48px 48px,
      repeating-radial-gradient(circle at center, rgba(131, 83, 59, 0.016) 0 3px, transparent 3px 20px),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: 0.1;
    background:
      url("/static/images/龙鸟.svg") left 24px top 24px / 180px auto no-repeat,
      url("/static/images/花边2.svg") left 24px bottom 24px / 140px auto no-repeat,
      url("/static/images/long.svg") center bottom 100px / 200px auto no-repeat,
      url("/static/images/祥云_祥云.svg") right 24px top 24px / 180px auto no-repeat,
      url("/static/images/一品红.svg") right 24px bottom 24px / 160px auto no-repeat,
      url("/static/images/菏泽牡丹.svg") left 150px center / 220px auto no-repeat,
      url("/static/images/茶叶.svg") center center / 260px auto no-repeat,
      url("/static/images/回纹_画板 1.svg") right 150px center / 200px auto no-repeat;
  }

  .wrap {
    width: min(1440px, 92vw);
    margin: 0 auto;
    padding: 40px 20px 56px;
  }

  .hero {
    text-align: center;
    margin-bottom: 26px;
    padding-bottom: 20px;
    position: relative;
    background: transparent;
  }

  .hero::after {
    content: "";
    display: block;
    width: 140px;
    height: 1px;
    margin: 18px auto 0;
    background: linear-gradient(90deg,
        transparent,
        rgba(124, 81, 61, 0.6),
        transparent);
  }

  .hero h1 {
    margin: 0;
    color: var(--line);
    font-size: clamp(30px, 3.6vw, 48px);
    letter-spacing: 0.18em;
    font-weight: 600;
  }

  .hero p {
    margin: 16px auto 0;
    max-width: 760px;
    font-size: clamp(14px, 1.35vw, 17px);
    line-height: 2;
    color: var(--text-soft);
    letter-spacing: 0.03em;
  }

  .video-band {
    margin: 4px 0 32px;
    position: relative;
  }

  .video-frame {
    position: relative;
    overflow: hidden;
    border-radius: 30px;
    height: 180px;
    transform: translateZ(0);
    will-change: transform;
    background:
      linear-gradient(180deg, rgba(247, 241, 232, 0.18), rgba(124, 81, 61, 0.08)),
      #ddd3c4;
    border: 1px solid rgba(124, 81, 61, 0.08);
    box-shadow:
      0 16px 36px rgba(93, 62, 45, 0.05),
      inset 0 0 0 1px rgba(255, 255, 255, 0.15);
  }

  .video-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(247, 241, 232, 0.30), rgba(247, 241, 232, 0.12)),
      linear-gradient(90deg,
        rgba(247, 241, 232, 0.14),
        transparent 18%,
        transparent 82%,
        rgba(247, 241, 232, 0.14));
  }

  .video-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: rgba(124, 81, 61, 0.05);
  }

  .video-el {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    filter: saturate(0.82) contrast(0.92) brightness(0.96);
    transform: scale(1.02);
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.8fr) minmax(320px, 0.62fr);
    gap: 26px;
    align-items: stretch;
  }

  .timeline-panel,
  .info-panel {
    background:
      radial-gradient(circle at center, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.14)),
      var(--paper);
    border: 1px solid rgba(124, 81, 61, 0.08);
    backdrop-filter: blur(8px);
  }

  .timeline-panel {
    border-radius: 32px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    min-height: 740px;
    box-shadow:
      0 24px 60px rgba(93, 62, 45, 0.08),
      inset 0 0 0 1px rgba(124, 81, 61, 0.06);
  }

  .timeline-panel::before,
  .timeline-panel::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: min(11vw, 160px);
    pointer-events: none;
    opacity: 0.14;
    z-index: 0;
  }

  .timeline-panel::before {
    left: 0;
    background:
      linear-gradient(180deg, transparent, rgba(131, 83, 59, 0.08)),
      radial-gradient(circle at 42% 20%, rgba(131, 83, 59, 0.26) 0 18%, transparent 19%),
      radial-gradient(circle at 55% 38%, rgba(131, 83, 59, 0.15) 0 15%, transparent 16%),
      radial-gradient(circle at 38% 68%, rgba(131, 83, 59, 0.2) 0 18%, transparent 19%),
      radial-gradient(circle at 65% 86%, rgba(131, 83, 59, 0.16) 0 14%, transparent 15%);
    clip-path: polygon(0 0, 76% 6%, 70% 18%, 88% 36%, 62% 52%, 76% 72%, 54% 100%, 0 100%);
  }

  .timeline-panel::after {
    right: 0;
    background:
      linear-gradient(180deg, transparent, rgba(131, 83, 59, 0.08)),
      radial-gradient(circle at 62% 22%, rgba(131, 83, 59, 0.22) 0 18%, transparent 19%),
      radial-gradient(circle at 46% 48%, rgba(131, 83, 59, 0.15) 0 16%, transparent 17%),
      radial-gradient(circle at 72% 75%, rgba(131, 83, 59, 0.18) 0 20%, transparent 21%);
    clip-path: polygon(30% 0, 100% 0, 100% 100%, 26% 100%, 40% 72%, 18% 56%, 34% 30%);
  }

  .chart-head {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
    padding: 4px 8px 0;
  }

  .chart-head .title {
    position: relative;
    padding-left: 14px;
    font-size: 18px;
    color: var(--line);
    letter-spacing: 0.08em;
  }

  .chart-head .title::before {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--gold);
    transform: translateY(-50%);
    box-shadow: 0 0 0 4px rgba(179, 131, 45, 0.12);
  }

  .chart-head .hint {
    font-size: 13px;
    color: rgba(111, 65, 43, 0.82);
  }

  .chart {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 620px;
    overflow: hidden;
    border-radius: 24px;
    background:
      radial-gradient(circle at center, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.08)),
      repeating-radial-gradient(circle at center, rgba(131, 83, 59, 0.008) 0 2px, transparent 2px 18px),
      var(--card);
    box-shadow: inset 0 18px 48px rgba(93, 62, 45, 0.07);
  }

  svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
  }

  svg.is-dragging {
    cursor: grabbing;
  }

  .flow {
    fill: none;
    stroke: var(--line);
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 5 7;
    vector-effect: non-scaling-stroke;
    opacity: 0.92;
  }

  .dynasty-node {
    cursor: pointer;
    outline: none;
  }

  .dynasty-node .dot,
  .dynasty-node .dot-core,
  .dynasty-node .stem,
  .dynasty-node .label-char {
    transition: opacity 0.2s ease, transform 0.2s ease, filter 0.2s ease, fill 0.2s ease, stroke 0.2s ease;
  }

  .dynasty-node:hover .dot,
  .dynasty-node:focus .dot,
  .dynasty-node.is-active .dot {
    filter: drop-shadow(0 8px 18px rgba(90, 50, 30, 0.28));
    stroke: var(--active);
  }

  .dynasty-node:hover .dot-core,
  .dynasty-node:focus .dot-core,
  .dynasty-node.is-active .dot-core {
    fill: #fff6ea;
  }

  .info-panel {
    border-radius: 32px;
    padding: 24px 22px;
    position: relative;
    min-height: 740px;
    height: 740px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow:
      0 18px 44px rgba(93, 62, 45, 0.06),
      inset 0 0 0 1px rgba(255, 255, 255, 0.12);
  }

  .info-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 8px;
    scrollbar-width: thin;
    scrollbar-color: transparent transparent;
  }

  .info-scroll::-webkit-scrollbar {
    width: 8px;
  }

  .info-scroll::-webkit-scrollbar-track {
    background: transparent;
    border-radius: 999px;
  }

  .info-scroll::-webkit-scrollbar-thumb {
    background: transparent;
    border-radius: 999px;
    transition: background 0.18s ease;
  }

  .info-panel.is-scrolling .info-scroll,
  .info-scroll:hover {
    scrollbar-color: rgba(124, 81, 61, 0.32) rgba(124, 81, 61, 0.08);
  }

  .info-panel.is-scrolling .info-scroll::-webkit-scrollbar-track,
  .info-scroll:hover::-webkit-scrollbar-track {
    background: rgba(124, 81, 61, 0.08);
  }

  .info-panel.is-scrolling .info-scroll::-webkit-scrollbar-thumb,
  .info-scroll:hover::-webkit-scrollbar-thumb {
    background: rgba(124, 81, 61, 0.32);
  }

  .panel-kicker {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .info-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(124, 81, 61, 0.12);
    margin-bottom: 18px;
  }

  .info-title {
    font-size: 30px;
    color: var(--line);
    letter-spacing: 0.08em;
    line-height: 1.2;
    margin: 0;
  }

  .info-preview {
    width: 100%;
    max-width: 420px;
    flex: 0 0 auto;
    margin: 0 auto 22px;
  }

  .carousel-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 7 / 5;
    border-radius: 8px;
    overflow: hidden;
    background: #efe7da;
    box-shadow:
      inset 0 0 0 1px rgba(124, 81, 61, 0.08),
      0 8px 20px rgba(93, 62, 45, 0.04);
  }

  .carousel-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.5s ease;
  }

  .carousel-frame img.is-fading {
    opacity: 0.25;
  }

  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 249, 241, 0.88);
    color: var(--line);
    box-shadow: 0 4px 16px rgba(93, 62, 45, 0.12);
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 20px;
    line-height: 1;
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, background 0.2s ease;
  }

  .carousel-frame:hover .carousel-btn,
  .carousel-frame:focus-within .carousel-btn {
    opacity: 1;
    pointer-events: auto;
  }

  .carousel-btn:hover,
  .carousel-btn:focus-visible {
    background: rgba(255, 255, 255, 0.96);
    outline: none;
  }

  .carousel-btn.prev {
    left: 10px;
  }

  .carousel-btn.next {
    right: 10px;
  }

  .carousel-meta {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .carousel-counter {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: rgba(107, 63, 44, 0.78);
    white-space: nowrap;
  }

  .carousel-dots {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .carousel-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    border: 0;
    padding: 0;
    background: rgba(124, 81, 61, 0.18);
    cursor: pointer;
    transition: transform 0.18s ease, background 0.18s ease;
  }

  .carousel-dot.is-active {
    background: var(--line);
    transform: scale(1.15);
  }

  .info-block {
    margin-bottom: 14px;
    padding: 16px 16px 14px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.46);
    border: 1px solid rgba(124, 81, 61, 0.08);
    box-shadow: 0 6px 18px rgba(93, 62, 45, 0.04);
  }

  .info-block:first-of-type {
    background: rgba(255, 252, 246, 0.62);
  }

  .info-block:last-child {
    margin-bottom: 0;
  }

  .info-block h3 {
    margin: 0 0 8px;
    font-size: 15px;
    color: var(--line);
    letter-spacing: 0.06em;
  }

  .info-block p {
    margin: 0;
    font-size: 14px;
    color: var(--text-soft);
    line-height: 1.95;
  }

  @media (max-width: 1120px) {
    .layout {
      grid-template-columns: 1fr;
    }

    .info-panel {
      min-height: 0;
      height: auto;
    }
  }

  @media (max-width: 720px) {
    .wrap {
      width: min(96vw, 1440px);
      padding: 24px 10px 28px;
    }

    .hero {
      margin-bottom: 20px;
      padding-bottom: 16px;
    }

    .hero h1 {
      font-size: clamp(26px, 8vw, 34px);
      letter-spacing: 0.12em;
    }

    .video-frame {
      height: 132px;
      border-radius: 20px;
    }

    .timeline-panel,
    .info-panel {
      border-radius: 22px;
    }

    .timeline-panel {
      padding: 14px;
      min-height: auto;
    }

    .chart {
      height: 520px;
      border-radius: 18px;
    }

    .chart-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .info-title {
      font-size: 24px;
    }

    .info-preview {
      max-width: 220px;
      margin-bottom: 16px;
    }

    .info-panel {
      min-height: 0;
      height: auto;
    }
  }
</style>
</head>

<body>
  <div class="wrap">
    <header class="hero">
      <h1>中国纹样的演变</h1>
      <p>从史前质朴符号到现代创意转译，纹样在题材、技法与精神内涵中持续演进。沿时间轴观察各朝代纹样的萌芽、鼎盛、转型与融合，理解其艺术语言如何随社会变迁、文化交融与审美更迭而不断焕发新生。</p>
    </header>

    <section class="video-band" aria-hidden="true">
      <div class="video-frame" id="videoFrame">
        <video class="video-el" src="/static/video/motif-evolution.mp4" autoplay muted loop playsinline></video>
      </div>
    </section>

    <section class="layout">
      <div class="timeline-panel">
        <div class="chart-head">
          <div class="title">历代纹样时间轴</div>
          <div class="hint">滚轮缩放 · 拖动画面 · 点击节点查看详细说明</div>
        </div>
        <div class="chart" id="chart">
          <svg id="scene" viewBox="0 0 2048 1060" preserveAspectRatio="xMidYMid meet" aria-labelledby="svgTitle svgDesc"
            role="img">
            <title id="svgTitle">中国纹样朝代演变时间轴</title>
            <desc id="svgDesc">展示中国纹样从史前到现代的朝代演变路径，节点可交互查看详细信息。</desc>
            <g id="sceneDecor"></g>
            <path id="dynastyPath" class="flow"></path>
            <g id="nodesLayer"></g>
          </svg>
        </div>
      </div>

      <aside class="info-panel" id="infoPanel">
        <div class="panel-kicker">DYNASTY MOTIF</div>
        <div class="info-header">
          <h2 class="info-title" id="infoTitle">史前</h2>
        </div>
        <div class="info-scroll" id="infoScroll">
          <div class="info-preview">
            <div class="carousel-frame">
              <button class="carousel-btn prev" id="carouselPrev" type="button" aria-label="查看上一张">‹</button>
              <img id="infoImage" alt="朝代代表纹样预览" src="" />
              <button class="carousel-btn next" id="carouselNext" type="button" aria-label="查看下一张">›</button>
            </div>
            <div class="carousel-meta">
              <div class="carousel-counter" id="carouselCounter"></div>
              <div class="carousel-dots" id="carouselDots"></div>
            </div>
          </div>

          <div class="info-block">
            <h3>时代特征</h3>
            <p id="infoFeature"></p>
          </div>
          <div class="info-block">
            <h3>形式特点</h3>
            <p id="infoForm"></p>
          </div>
          <div class="info-block">
            <h3>演变意义</h3>
            <p id="infoEvolution"></p>
          </div>
        </div>
      </aside>
    </section>
  </div>

  <script>
    const BASE_W = 2048;
    const BASE_H = 1060;
    const NS = 'http://www.w3.org/2000/svg';

    const dynasties = [
      { name: '史前', x: 190, y: 770, dir: 'up', stem: 68 },
      { name: '夏商周', x: 388, y: 694, dir: 'up', stem: 58 },
      { name: '春秋战国', x: 610, y: 560, dir: 'up', stem: 70, labelClass: 'tight', labelX: -4 },
      { name: '秦汉', x: 820, y: 490, dir: 'down', stem: 56 },
      { name: '魏晋南北朝', x: 978, y: 328, dir: 'up', stem: 72, labelClass: 'tight', labelX: 2 },
      { name: '隋唐', x: 1168, y: 302, dir: 'up', stem: 78 },
      { name: '五代十国', x: 1242, y: 468, dir: 'down', stem: 58, labelClass: 'tight', labelX: 6 },
      { name: '宋', x: 1386, y: 662, dir: 'down', stem: 56 },
      { name: '元', x: 1562, y: 470, dir: 'up', stem: 54 },
      { name: '明', x: 1716, y: 430, dir: 'up', stem: 50 },
      { name: '清', x: 1860, y: 520, dir: 'down', stem: 56 },
      { name: '现代', x: 1970, y: 446, dir: 'up', stem: 62 }
    ];

    const dynastyInfo = {
      '史前': {
        feature: '史前纹饰艺术与实用紧密结合，主要依附于彩陶、玉器等器物。它反映了原始社会以狩猎、农业为主的经济生活，并因地域、时间及宗教习俗差异呈现出多样的文化类型，体现了物质创造与审美意识的初步统一。',
        form: '纹饰多位于陶器显著位置，采用红、黑、白等色彩，风格朴实明快。题材涵盖动物纹、植物纹、旋涡纹与几何纹，线条流畅简洁。半坡类型厚重、庙底沟类型饱满、马家窑类型动感，整体装饰效果极强。',
        evolution: '纹饰内容经历了从直接摹写自然物到抽象几何图案的飞跃，标志着原始人类思维能力的巨大提升。同时，纹饰载体从实用工具向礼器、装饰品过渡，为中国后世装饰艺术奠定了造型与美学基础。'
      },
      '夏商周': {
        feature: '夏商周时期属奴隶社会，为维护统治和满足贵族生活需要，青铜冶铸等手工业技艺精湛，以青铜器艺术成就最为辉煌，故称“青铜时代”。纹饰服务于礼乐制度和宗教权威，整体呈现神秘、雄奇、威严的时代风貌。',
        form: '纹饰与铸造工艺紧密结合，适应器形体态分布于腹、颈、圈足等部位。以动物纹（饕餮、龙、鸟等）和几何纹（云雷、环带等）为主。商代纹饰华丽雄奇、神秘庄重；西周中后期趋向简练朴素，带状花纹增多，饕餮纹渐衰。',
        evolution: '从夏代纹饰尚不发达，到商代鼎盛期的雄奇神秘，再到西周中后期的简练朴素、日趋减率，反映了奴隶社会由形成、鼎盛到趋向衰落的历史进程。纹饰风格变化也体现了礼制观念和审美风尚的逐步转型。'
      },
      '春秋战国': {

        activeImageIndex = nextIndex;
        infoImage.src = images[activeImageIndex];
        infoImage.alt = `${name}代表纹样预览 ${activeImageIndex + 1}`;
        carouselCounter.textContent = `${activeImageIndex + 1} / ${images.length}`;
        carouselPrev.disabled = images.length <= 1;
        carouselNext.disabled = images.length <= 1;
        carouselDots.innerHTML = '';

        images.forEach((_, idx) => {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = `carousel-dot${idx === activeImageIndex ? ' is-active' : ''}`;
          dot.setAttribute('aria-label', `查看第 ${idx + 1} 张图片`);
          dot.addEventListener('click', () => {
            stopAutoplay();
            renderCarousel(name, idx, true);
          });
          carouselDots.appendChild(dot);
        });
      };

      window.clearTimeout(fadeTimer);

      if (!withFade) {
        infoImage.classList.remove('is-fading');
        updateCarouselUI();
        return;
      }

      infoImage.classList.add('is-fading');

      fadeTimer = window.setTimeout(() => {
        updateCarouselUI();
        requestAnimationFrame(() => {
          infoImage.classList.remove('is-fading');
        });
      }, FADE_DURATION);

    function catmullRomToBezier(points) {
      if (points.length < 2) return '';
      let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;
        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;
        d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
      }
      return d;
    }

      pt.y = clientY;
      const ctm = svg.getScreenCTM();
      return ctm ? pt.matrixTransform(ctm.inverse()) : { x: clientX, y: clientY };
    }

    function clampPan() {
      const maxTx = ((zoomState.scale - 1) * BASE_W) / 2;
      const maxTy = ((zoomState.scale - 1) * BASE_H) / 2;
      zoomState.tx = clamp(zoomState.tx, -maxTx, maxTx);
      zoomState.ty = clamp(zoomState.ty, -maxTy, maxTy);
    }

    function applyZoom() {
      const width = baseViewBox.width / zoomState.scale;
      const height = baseViewBox.height / zoomState.scale;
      clampPan();
      const x = baseViewBox.x + (baseViewBox.width - width) / 2 + zoomState.tx;
      const y = baseViewBox.y + (baseViewBox.height - height) / 2 + zoomState.ty;
      svg.setAttribute('viewBox', `${x.toFixed(2)} ${y.toFixed(2)} ${width.toFixed(2)} ${height.toFixed(2)}`);
    }

    function zoomAt(clientX, clientY, scaleFactor) {
      const before = getSvgPoint(clientX, clientY);
      const nextScale = clamp(zoomState.scale * scaleFactor, zoomState.minScale, zoomState.maxScale);
      if (nextScale === zoomState.scale) return;
      zoomState.scale = nextScale;
      applyZoom();
      const after = getSvgPoint(clientX, clientY);
      zoomState.tx += before.x - after.x;
      zoomState.ty += before.y - after.y;
      applyZoom();
    }

    function resetZoom() {
      zoomState.scale = 1;
      zoomState.tx = 0;
      zoomState.ty = 0;
      applyZoom();
    }

    function initZoomControls() {
      applyZoom();

      chartEl.addEventListener('wheel', (event) => {
        event.preventDefault();
        const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
        zoomAt(event.clientX, event.clientY, factor);
      }, { passive: false });

      svg.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        zoomState.isPanning = true;
        zoomState.pointerId = event.pointerId;
        zoomState.startClientX = event.clientX;
        zoomState.startClientY = event.clientY;
        zoomState.startTx = zoomState.tx;
        zoomState.startTy = zoomState.ty;
        svg.classList.add('is-dragging');
        if (svg.setPointerCapture) svg.setPointerCapture(event.pointerId);
      });

      svg.addEventListener('pointermove', (event) => {
        if (!zoomState.isPanning || event.pointerId !== zoomState.pointerId) return;
        const currentViewWidth = baseViewBox.width / zoomState.scale;
        const currentViewHeight = baseViewBox.height / zoomState.scale;
        const dx = (event.clientX - zoomState.startClientX) * (currentViewWidth / chartEl.clientWidth);
        const dy = (event.clientY - zoomState.startClientY) * (currentViewHeight / chartEl.clientHeight);
        zoomState.tx = zoomState.startTx - dx;
        zoomState.ty = zoomState.startTy - dy;
        applyZoom();
      });

      const stopPan = (event) => {
        if (zoomState.pointerId !== null && event.pointerId !== undefined && event.pointerId !== zoomState.pointerId) return;
        zoomState.isPanning = false;
        zoomState.pointerId = null;
        svg.classList.remove('is-dragging');
      };

      svg.addEventListener('pointerup', stopPan);
      svg.addEventListener('pointercancel', stopPan);
      svg.addEventListener('pointerleave', stopPan);
      svg.addEventListener('dblclick', resetZoom);
    }

    function buildDecor() {
      const defs = createSvgEl('defs');
      const filter = createSvgEl('filter', {
        id: 'softShadow',
        x: '-20%',
        y: '-20%',
        width: '140%',
        height: '140%'
      });
      filter.appendChild(createSvgEl('feDropShadow', {
        dx: '0',
        dy: '8',
        stdDeviation: '8',
        'flood-color': 'rgba(90,50,30,0.22)'
      }));
      defs.appendChild(filter);
      sceneDecor.appendChild(defs);
    }

    function addVerticalLabel(group, text, x, y, tight = false) {
      const chars = [...text];
      const fontSize = tight ? 24 : 28;
      const step = tight ? 26 : 30;

      chars.forEach((char, index) => {
        const el = createSvgEl('text', {
          x,
          y: y + index * step,
          'text-anchor': 'middle',
          'font-size': fontSize,
          'font-family': '"Noto Serif SC", "Source Han Serif SC", "STSong", serif',
          fill: '#6b3f2c',
          class: 'label-char'
        });
        el.textContent = char;
        group.appendChild(el);
      });
    }

    function buildNode(item) {
      const g = createSvgEl('g', {
        class: 'dynasty-node',
        tabindex: '0',
        role: 'button',
        'aria-label': `${item.name}代表纹样`
      });

      const hitArea = createSvgEl('circle', {
        cx: item.x,
        cy: item.y,
        r: '38',
        fill: 'rgba(0,0,0,0.001)',
        'pointer-events': 'all'
      });

      const stemY2 = item.dir === 'up' ? item.y - 12 : item.y + 12;
      const stemY1 = item.dir === 'up' ? stemY2 - item.stem : stemY2 + item.stem;

      const stem = createSvgEl('line', {
        x1: item.x,
        y1: stemY1,
        x2: item.x,
        y2: stemY2,
        stroke: 'rgba(124,81,61,0.55)',
        'stroke-width': '2',
        class: 'stem'
      });

      const labelGroup = createSvgEl('g');
      const labelX = item.x + (item.labelX || 0);
      const labelStartY = item.dir === 'up'
        ? stemY1 - 16 - ([...item.name].length - 1) * (item.labelClass === 'tight' ? 26 : 30)
        : stemY1 + 34;

      addVerticalLabel(labelGroup, item.name, labelX, labelStartY, item.labelClass === 'tight');

      const dot = createSvgEl('circle', {
        cx: item.x,
        cy: item.y,
        r: '13',
        fill: '#fffdf9',
        stroke: '#7f4b33',
        'stroke-width': '5',
        class: 'dot'
      });

      const dotCore = createSvgEl('circle', {
        cx: item.x,
        cy: item.y,
        r: '10.5',
        fill: '#fffdf9',
        class: 'dot-core'
      });

      g.appendChild(hitArea);
      g.appendChild(stem);
      g.appendChild(labelGroup);
      g.appendChild(dot);
      g.appendChild(dotCore);

      const activate = () => setActiveDynasty(item.name);

      // g.addEventListener('mouseenter', activate);
      g.addEventListener('focus', activate);
      g.addEventListener('click', activate);
      g.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activate();
        }
      });

      nodesLayer.appendChild(g);
      nodeMap.set(item.name, { group: g });
    }

    function renderCurve() {
      path.setAttribute('d', catmullRomToBezier(curvePoints));
    }

    function updateInfoPanel(name) {
      const info = dynastyInfo[name];
      infoTitle.textContent = name;
      infoFeature.textContent = info.feature;
      infoForm.textContent = info.form;
      infoEvolution.textContent = info.evolution;
      renderCarousel(name, 0, false);
      infoScroll.scrollTop = 0;
      startAutoplay();
    }

    function setActiveDynasty(name) {
      activeName = name;
      nodeMap.forEach(({ group }, key) => {
        group.classList.toggle('is-active', key === name);
      });
      updateInfoPanel(name);
    }

    function initPanelInteraction() {
      carouselPrev.addEventListener('click', () => {
        stopAutoplay();
        renderCarousel(activeName, activeImageIndex - 1, true);
      });

      carouselNext.addEventListener('click', () => {
        stopAutoplay();
        renderCarousel(activeName, activeImageIndex + 1, true);
      });

      carouselDots.addEventListener('mouseenter', stopAutoplay);
      carouselDots.addEventListener('mouseleave', startAutoplay);
      infoImage.addEventListener('mouseenter', stopAutoplay);
      infoImage.addEventListener('mouseleave', startAutoplay);

      infoScroll.addEventListener('scroll', () => {
        infoPanel.classList.add('is-scrolling');
        window.clearTimeout(scrollTimer);
        scrollTimer = window.setTimeout(() => {
          infoPanel.classList.remove('is-scrolling');
        }, 500);
      }, { passive: true });
    }

    function initVideoParallax() {
      const update = () => {
        if (!videoFrame) return;
        const y = Math.min(window.scrollY, 600);
        videoFrame.style.transform = `translateY(${y * 0.06}px)`;
      };
      update();
      window.addEventListener('scroll', update, { passive: true });
    }

    function renderAll() {
      buildDecor();
      renderCurve();
      dynasties.forEach(buildNode);
      initZoomControls();
      initPanelInteraction();
      initVideoParallax();
      setActiveDynasty(activeName);
    }

    renderAll();
  </script>
</body>
