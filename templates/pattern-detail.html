{% extends 'base.html' %}

{% block title %}纹样详情 - 中华传统纹样数字库{% endblock %}

{% block content %}
<div class="pattern-detail-page">
    <div class="container">
        <div id="patternDetail">
            <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
        </div>
    </div>
</div>

<style>
.pattern-detail-page {
    padding: 40px 0;
    min-height: calc(100vh - 200px);
}

.pattern-detail {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
}

.detail-header {
    padding: 30px;
    border-bottom: 1px solid var(--border-color);
}

.detail-header h1 {
    font-size: 2rem;
    color: var(--primary-color);
    margin-bottom: 15px;
}

.detail-meta {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    color: var(--text-light);
}

.detail-meta span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.detail-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    padding: 30px;
}

.detail-image {
    background: var(--bg-light);
    border-radius: 12px;
    overflow: hidden;
    /* 添加固定宽高比 */
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.detail-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;  /* 改为 contain，保持完整图片显示 */
    display: block;
}

.detail-info .info-section {
    margin-bottom: 25px;
}

.detail-info .info-section h3 {
    font-size: 1.1rem;
    color: var(--primary-color);
    margin-bottom: 10px;
    padding-bottom: 5px;
    border-bottom: 2px solid var(--border-color);
}

.detail-info .info-section p {
    line-height: 1.8;
    color: var(--text-dark);
}

.detail-actions {
    display: flex;
    gap: 15px;
    padding: 20px 30px 30px;
    border-top: 1px solid var(--border-color);
}

.detail-actions button {
    padding: 10px 24px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s;
}

.detail-actions .btn-primary {
    background: var(--primary-color);
    color: white;
}

.detail-actions .btn-primary:hover {
    background: var(--secondary-color);
}

.detail-actions .btn-secondary {
    background: #f5f5f5;
    color: var(--text-dark);
}

.detail-actions .btn-secondary:hover {
    background: #e0e0e0;
}

.detail-actions .btn-liked {
    background: #e74c3c;
    color: white;
}

.detail-actions .btn-liked:hover {
    background: #c0392b;
}

.detail-actions .btn-collected {
    background: #f4b400;
    color: white;
}

.detail-actions .btn-collected:hover {
    background: #d89c00;
}

.related-patterns {
    padding: 0 30px 30px;
}

.related-patterns h3 {
    margin-bottom: 20px;
}

.related-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 15px;
}

.related-item {
    cursor: pointer;
    text-align: center;
}

.related-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 8px;
}

.related-item span {
    font-size: 0.85rem;
}

@media (max-width: 768px) {
    .detail-content {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
const patternId = window.location.pathname.split('/')[2];

async function loadPatternDetail() {
    try {
        const response = await fetch(`/api/patterns/patterns/${patternId}/`);
        const pattern = await response.json();
        renderDetail(pattern);
        loadRelatedPatterns(pattern.category);
    } catch (error) {
        console.error('加载详情失败:', error);
        document.getElementById('patternDetail').innerHTML = '<div class="loading-spinner">加载失败，请刷新重试</div>';
    }
}

function renderDetail(pattern) {
    const html = `
        <div class="pattern-detail">
            <div class="detail-header">
                <h1>${pattern.name}</h1>
                <div class="detail-meta">
                    <span><i class="fas fa-calendar"></i> ${pattern.dynasty_name || '未知'}</span>
                    <span><i class="fas fa-tag"></i> ${pattern.category_name || '未分类'}</span>
                    <span><i class="fas fa-eye"></i> ${pattern.view_count || 0} 次浏览</span>
                    <span><i class="fas fa-heart"></i> ${pattern.like_count || 0} 点赞</span>
                </div>
            </div>
            
            <div class="detail-content">
                <div class="detail-image">
                    <img src="${pattern.image_hd || pattern.thumbnail}" alt="${pattern.name}">
                </div>
                
                <div class="detail-info">
                    <div class="info-section">
                        <h3><i class="fas fa-star"></i> 纹样寓意</h3>
                        <p>${pattern.meaning || '暂无'}</p>
                    </div>
                    
                    <div class="info-section">
                        <h3><i class="fas fa-shapes"></i> 视觉特征</h3>
                        <p>${getVisualTypeName(pattern.visual_type)}</p>
                    </div>
                    
                    <div class="info-section">
                        <h3><i class="fas fa-palette"></i> 色彩倾向</h3>
                        <p>${getColorTypeName(pattern.color_type)}</p>
                    </div>
                    
                    <div class="info-section">
                        <h3><i class="fas fa-book-open"></i> 纹样故事</h3>
                        <p>${pattern.story || '暂无故事介绍'}</p>
                    </div>
                    
                    <div class="info-section">
                        <h3><i class="fas fa-building"></i> 应用场景</h3>
                        <p>${pattern.application || '适用于传统服饰、建筑装饰、文创产品等'}</p>
                    </div>
                    
                    ${pattern.cultural_relic ? `
                    <div class="info-section">
                        <h3><i class="fas fa-landmark"></i> 文物出处</h3>
                        <p>${pattern.cultural_relic}</p>
                    </div>
                    ` : ''}
                </div>
            </div>
            
            <div class="detail-actions">
                <button class="${pattern.is_liked ? 'btn-liked' : 'btn-primary'}" onclick="likePattern(${pattern.id})">
                    <i class="${pattern.is_liked ? 'fas' : 'far'} fa-heart"></i>
                    ${pattern.is_liked ? '已点赞' : '点赞'}
                </button>

                <button class="${pattern.is_collected ? 'btn-collected' : 'btn-secondary'}" onclick="collectPattern(${pattern.id})">
                    <i class="${pattern.is_collected ? 'fas' : 'far'} fa-star"></i>
                    ${pattern.is_collected ? '已收藏' : '收藏'}
                </button>

                <button class="btn-secondary" onclick="startDesign(${pattern.id})">
                    <i class="fas fa-palette"></i> 开始设计
                </button>
            </div>
        </div>
    `;
    document.getElementById('patternDetail').innerHTML = html;
}

function getVisualTypeName(type) {
    const types = {
        'symmetry': '对称', 'rotation': '旋转', 
        'continuous': '连续', 'single': '单独', 'suitable': '适合'
    };
    return types[type] || type;
}

function getColorTypeName(type) {
    const types = {
        'red_gold': '红金色系', 'green_blue': '青绿色系',
        'black_white': '黑白灰系', 'colorful': '多彩系'
    };
    return types[type] || type;
}

function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) {
        return parts.pop().split(';').shift();
    }
    return null;
}

async function likePattern(id) {
    const token = localStorage.getItem('token');
    if (!token) {
        alert('请先登录');
        return;
    }

    try {
        const response = await fetch(`/api/patterns/patterns/${id}/like/`, {
            method: 'POST',
            headers: {
                'Authorization': `Token ${token}`,
                'Content-Type': 'application/json'
            }
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
            alert(data.message || '操作成功');
            loadPatternDetail();
        } else {
            alert(data.detail || data.error || `操作失败：${response.status}`);
            console.error('点赞失败:', response.status, data);
        }
    } catch (error) {
        console.error('点赞失败:', error);
        alert('网络错误，点赞失败');
    }
}

async function collectPattern(id) {
    const token = localStorage.getItem('token');
    if (!token) {
        alert('请先登录');
        return;
    }

    try {
        const response = await fetch(`/api/patterns/patterns/${id}/collect/`, {
            method: 'POST',
            headers: {
                'Authorization': `Token ${token}`,
                'Content-Type': 'application/json'
            }
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
            alert(data.message || '操作成功');
            loadPatternDetail();
        } else {
            alert(data.detail || data.error || `操作失败：${response.status}`);
            console.error('收藏失败:', response.status, data);
        }
    } catch (error) {
        console.error('收藏失败:', error);
        alert('网络错误，收藏失败');
    }
}

function startDesign(id) {
    window.location.href = `/design/?pattern=${id}`;
}

async function loadRelatedPatterns(category) {
    if (!category) return;
    try {
        const response = await fetch(`/api/patterns/patterns/?category=${category}&page_size=4`);
        const data = await response.json();
        const patterns = data.results || data;
        if (patterns.length > 0) {
            const relatedHtml = `
                <div class="related-patterns">
                    <h3>相关推荐</h3>
                    <div class="related-grid">
                        ${patterns.filter(p => p.id != patternId).map(p => `
                            <div class="related-item" onclick="viewPattern(${p.id})">
                                <img src="${p.thumbnail}" alt="${p.name}">
                                <span>${p.name}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.querySelector('.pattern-detail')?.insertAdjacentHTML('beforeend', relatedHtml);
        }
    } catch (error) {
        console.error('加载相关纹样失败:', error);
    }
}

function viewPattern(id) {
    window.location.href = `/pattern/${id}/`;
}

loadPatternDetail();
</script>
{% endblock %}
