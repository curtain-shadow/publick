<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>搜索</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Microsoft YaHei", sans-serif;
      }
      body {
        background: #faf6f0;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        margin: auto;
      }
      .back {
        margin-bottom: 20px;
        color: #9c7a5b;
        font-size: 16px;
        cursor: pointer;
      }
      .search-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        position: relative;
      }
      .search-input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 16px;
      }
      .search-btn {
        padding: 12px 20px;
        background: #9c7a5b;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16px;
      }
      /* 输入联想下拉框 */
      .suggest-dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        right: 80px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        margin-top: 4px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 999;
        display: none;
      }
      .suggest-item {
        padding: 10px 14px;
        cursor: pointer;
        border-bottom: 1px solid #f0f0f0;
      }
      .suggest-item:hover {
        background: #f5efe9;
        color: #9c7a5b;
      }
      .title {
        margin-bottom: 12px;
        font-size: 16px;
        color: #666;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .clear-btn {
        color: #9c7a5b;
        cursor: pointer;
        font-size: 14px;
      }
      .histories {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .history-item {
        background: #fff;
        padding: 8px 12px;
        border-radius: 12px;
        cursor: pointer;
      }
      .suggest {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .suggest-hot-item {
        background: #f5efe9;
        color: #9c7a5b;
        padding: 8px 12px;
        border-radius: 12px;
        cursor: pointer;
      }
      /* 热门话题排行榜样式 */
      .hot-rank {
        margin-bottom: 20px;
      }
      .rank-item {
        background: #fff;
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .rank-num {
        color: #9c7a5b;
        font-weight: bold;
        min-width: 20px;
      }
      .rank-title {
        flex: 1;
      }
      .rank-count {
        color: #999;
        font-size: 13px;
        .rank-change {
          margin-left: 8px;
          font-size: 12px;
        }
      }
      .result-item {
        background: #fff;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .result-item:hover {
        background: #faf6f0;
      }
      /* 控制显示/隐藏的类 */
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="back" id="backBtn" onclick="handleBack()">← 返回</div>
      <div class="search-bar">
        <input
          class="search-input"
          id="kw"
          placeholder="输入纹样关键词"
          oninput="handleInput()"
          onfocus="handleSearchFocus()"
        />
        <button class="search-btn" onclick="doSearch()">搜索</button>
        <!-- 输入联想下拉框 -->
        <div class="suggest-dropdown" id="suggestDropdown"></div>
      </div>

      <!-- 排行榜视图（默认显示） -->
      <div id="rankView">
        <div class="title">
          <span>历史搜索</span>
          <span
            class="clear-btn"
            id="clearHistory"
            onclick="clearSearchHistory()"
            >清除历史</span
          >
        </div>
        <div class="histories" id="historyList"></div>

        <div class="title">猜你想搜</div>
        <div class="suggest" id="guessSuggest"></div>

        <div class="title">热门话题排行榜</div>
        <div class="hot-rank" id="hotRank"></div>
      </div>

      <!-- 搜索结果视图（默认隐藏） -->
      <div id="resultView" class="hidden">
        <div id="result"></div>
      </div>
    </div>

    <script>
      // 当前用户信息
      const currentUser = { id: 1, name: "测试用户" };
      // 预设联想词库
      const suggestLib = {
        国潮: [
          "国潮纹样",
          "国潮纹样设计",
          "国潮纹样怎么做",
          "国潮纹样元素",
          "国潮纹样应用",
        ],
        卷草: ["中式卷草纹", "卷草纹寓意", "卷草纹服饰", "卷草纹包装设计"],
        服饰: ["服饰纹样", "服饰纹样设计", "服饰纹样元素", "服饰纹样国潮"],
        莫兰迪: ["莫兰迪配色纹样", "莫兰迪配色设计", "莫兰迪配色应用"],
        中式: ["中式纹样", "中式传统纹样", "中式纹样元素", "中式纹样设计"],
        日式: ["日式家纹", "日式纹样", "日式纹样设计"],
        几何: ["几何纹样", "几何纹样设计", "几何纹样应用"],
      };

      // ✅ 核心状态管理：用sessionStorage永久保存最后一次搜索
      let currentView = "rank"; // rank / result

      // 输入联想处理
      function handleInput() {
        const kw = document.getElementById("kw").value.trim().toLowerCase();
        const dropdown = document.getElementById("suggestDropdown");

        if (!kw) {
          dropdown.style.display = "none";
          return;
        }

        let matched = [];
        for (let key in suggestLib) {
          if (key.toLowerCase().includes(kw)) {
            matched = [...matched, ...suggestLib[key]];
          }
          suggestLib[key].forEach((item) => {
            if (item.toLowerCase().includes(kw) && !matched.includes(item)) {
              matched.push(item);
            }
          });
        }
        matched = [...new Set(matched)].slice(0, 5);

        if (matched.length === 0) {
          dropdown.style.display = "none";
          return;
        }

        dropdown.innerHTML = matched
          .map(
            (item) =>
              `<div class="suggest-item" onclick="selectSuggest('${item}')">${item}</div>`,
          )
          .join("");
        dropdown.style.display = "block";
      }

      // 点击联想词填充
      function selectSuggest(text) {
        document.getElementById("kw").value = text;
        document.getElementById("suggestDropdown").style.display = "none";
      }

      // 点击空白关闭下拉框
      document.addEventListener("click", (e) => {
        const dropdown = document.getElementById("suggestDropdown");
        const input = document.getElementById("kw");
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.style.display = "none";
        }
      });

      // 搜索框聚焦处理
      function handleSearchFocus() {
        if (currentView === "result") {
          // 从结果页点击搜索框，回到排行榜
          showRankView();
        } else {
          // 刷新排行榜数据
          renderHistory();
          renderGuessSuggest();
          renderHotRank();
        }
      }

      // ✅ 核心修复：返回按钮逻辑
      function handleBack() {
        if (currentView === "result") {
          // 结果页 → 点击返回 → 回到排行榜
          showRankView();
        } else {
          // 排行榜 → 点击返回 → 回到首页
          history.back();
        }
      }

      // ✅ 页面加载时：恢复最后一次搜索状态（详情页返回后触发）
      window.addEventListener("pageshow", function (event) {
        // 从sessionStorage读取最后一次搜索状态
        const lastSearch = sessionStorage.getItem("lastSearch");
        if (lastSearch) {
          const { kw, results } = JSON.parse(lastSearch);
          document.getElementById("kw").value = kw;
          renderResult(results);
          showResultView();
        } else {
          showRankView();
        }
      });

      // 显示排行榜视图
      function showRankView() {
        currentView = "rank";
        document.getElementById("rankView").classList.remove("hidden");
        document.getElementById("resultView").classList.add("hidden");
        // 刷新排行榜数据
        renderHistory();
        renderGuessSuggest();
        renderHotRank();
      }

      // 显示搜索结果视图
      function showResultView() {
        currentView = "result";
        document.getElementById("rankView").classList.add("hidden");
        document.getElementById("resultView").classList.remove("hidden");
      }

      // ✅ 渲染搜索结果（独立函数，用于恢复状态）
      function renderResult(results) {
        let result = document.getElementById("result");
        if (results.length === 0) {
          result.innerHTML =
            "<div style='padding:20px;color:#999'>暂无相关内容</div>";
          return;
        }
        result.innerHTML = results
          .map(
            (p) => `
                    <div class="result-item" onclick="location.href='detail.html?id=${p.id}'">
                        <h3>${p.title}</h3>
                        <div style="font-size:14px;color:#666;margin-top:6px">${p.content.slice(0, 50)}...</div>
                    </div>
                `,
          )
          .join("");
      }

      // 清除搜索历史
      function clearSearchHistory() {
        if (confirm("确定要清除所有搜索历史吗？")) {
          localStorage.removeItem("searchHistory");
          sessionStorage.removeItem("lastSearch"); // 同时清除搜索状态
          renderHistory();
          renderGuessSuggest();
          renderHotRank();
        }
      }

      // 渲染历史搜索
      function renderHistory() {
        // 读取去重后的历史用于展示
        let hist =
          JSON.parse(localStorage.getItem("searchHistoryUnique")) || [];
        hist = hist.slice(0, 10);
        const historyList = document.getElementById("historyList");

        if (hist.length === 0) {
          historyList.innerHTML = "<div style='color:#999'>暂无历史搜索</div>";
          return;
        }

        historyList.innerHTML = hist
          .map(
            (h) =>
              `<div class="history-item" onclick="fillHistory('${h}')">${h}</div>`,
          )
          .join("");
      }

      // 点击历史记录填充
      function fillHistory(text) {
        document.getElementById("kw").value = text;
      }

      // 渲染猜你想搜
      function renderGuessSuggest() {
        let hist = JSON.parse(localStorage.getItem("searchHistory")) || [];
        const guessSuggest = document.getElementById("guessSuggest");

        const baseSuggest = [
          "国潮纹样",
          "中式卷草纹",
          "服饰纹样",
          "莫兰迪配色",
        ];
        let extended = [];
        hist.forEach((h) => {
          if (suggestLib[h]) {
            extended = [...extended, ...suggestLib[h].slice(0, 2)];
          }
        });
        const finalSuggest = [...new Set([...extended, ...baseSuggest])].slice(
          0,
          6,
        );

        guessSuggest.innerHTML = finalSuggest
          .map(
            (item) =>
              `<div class="suggest-hot-item" onclick="fillHistory('${item}')">${item}</div>`,
          )
          .join("");
      }

      // 渲染热门话题排行榜（完全动态）
      function renderHotRank() {
        const hotRank = document.getElementById("hotRank");
        // 读取完整历史（含重复）用于计数
        let hist = JSON.parse(localStorage.getItem("searchHistory")) || [];

        let countMap = {};
        hist.forEach((word) => {
          countMap[word] = (countMap[word] || 0) + 1;
        });

        let sortedList = Object.entries(countMap)
          .map(([name, count]) => ({ name, count }))
          .sort((a, b) => b.count - a.count);

        const maxShow = 10;
        sortedList = sortedList.slice(0, maxShow);

        if (sortedList.length === 0) {
          hotRank.innerHTML =
            "<div style='color:#999;padding:10px'>暂无热门话题</div>";
          return;
        }

        // 保存本次排名，用于下次计算涨跌
        const prevRank = JSON.parse(localStorage.getItem("prevRank")) || {};
        localStorage.setItem("prevRank", JSON.stringify(countMap));

        // 计算涨跌
        sortedList.forEach((item, index) => {
          const prevPos = prevRank[item.name]
            ? Object.keys(prevRank).indexOf(item.name) + 1
            : null;
          item.change = prevPos ? prevPos - (index + 1) : 0;
        });

        hotRank.innerHTML = sortedList
          .map((item, index) => {
            let changeIcon = "";
            if (item.change > 0) {
              changeIcon = `<span style="color:green;margin-left:8px">↑${item.change}</span>`;
            } else if (item.change < 0) {
              changeIcon = `<span style="color:red;margin-left:8px">↓${Math.abs(item.change)}</span>`;
            } else {
              changeIcon = `<span style="color:#999;margin-left:8px">→</span>`;
            }
            return `
          <div class="rank-item" onclick="searchTopic('${item.name}')">
            <span class="rank-num">${index + 1}</span>
            <span class="rank-title">${item.name}</span>
            ${changeIcon}
            <span class="rank-count">${item.count}次搜索</span>
          </div>
        `;
          })
          .join("");
      }
      // 点击热门话题搜索
      function searchTopic(topicName) {
        document.getElementById("kw").value = topicName;
        doSearch();
      }

      // ✅ 最终版搜索功能（保存状态到sessionStorage，不清空搜索框）
      function doSearch() {
        let kw = document.getElementById("kw").value.trim();
        if (!kw) return;

        // 1. 保存搜索历史（保留搜索次数，仅去重历史展示列表）
        let hist = JSON.parse(localStorage.getItem("searchHistory")) || [];
        // 把当前关键词加入历史（不删除旧的，用于计数）
        hist.push(kw);
        // 去重后的历史用于展示（取最新10条）
        let uniqueHist = [...new Set(hist)].slice(0, 10);
        localStorage.setItem("searchHistory", JSON.stringify(hist)); // 存储完整历史（含重复，用于计数）
        localStorage.setItem("searchHistoryUnique", JSON.stringify(uniqueHist)); // 存储去重历史（用于展示）

        // 2. 关闭下拉框
        document.getElementById("suggestDropdown").style.display = "none";

        // 3. 搜索帖子
        let posts = JSON.parse(localStorage.getItem("patternPosts")) || [];
        let res = posts.filter((p) => {
          return p.title.includes(kw) || p.content.includes(kw);
        });

        // 4. ✅ 保存最后一次搜索状态到sessionStorage（永久有效，页面刷新/返回都能恢复）
        sessionStorage.setItem(
          "lastSearch",
          JSON.stringify({
            kw: kw,
            results: res,
          }),
        );

        // 5. 渲染结果，切换到结果视图
        renderResult(res);
        showResultView();
      }

      // 页面加载初始化
      window.onload = function () {
        // 初始化时先尝试恢复搜索状态
        const lastSearch = sessionStorage.getItem("lastSearch");
        if (lastSearch) {
          const { kw, results } = JSON.parse(lastSearch);
          document.getElementById("kw").value = kw;
          renderResult(results);
          showResultView();
        } else {
          showRankView();
        }
        document.getElementById("kw").addEventListener("keypress", (e) => {
          if (e.key === "Enter") doSearch();
        });
      };
    </script>
  </body>
</html>
